services:
  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_DB}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - database:/var/lib/postgresql/data/pgdata
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:7.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT:-5050}:80
    networks:
      - app
    restart: unless-stopped
    depends_on:
      - postgres

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.0.5-management
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit ${RABBITMQ_DISK_FREE_LIMIT:-524288000}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - ${RABBITMQ_PORT:-15672}:15672
    networks:
      - app
    restart: unless-stopped

  worker-default:
    container_name: worker-default
    build:
      context: .
      target: production
    command: [ "celery", "-A", "src.services.task.worker", "worker", "-c", "${TASK_CONCURRENCY}", "-n", "worker-default@%h", "-Q", "default", "-l", "${TASK_LOG_LEVEL:-info}", "-f", "${TASK_LOG_FILE}", "-E" ]
    environment:
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
      TASK_BROKER_URI: ${TASK_BROKER_URI}
    restart: unless-stopped
    networks:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "celery", "-A", "src.services.task.worker", "inspect", "ping" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s

  flower:
    container_name: flower
    image: mher/flower:2.0
    command: ["celery", "--broker=${TASK_BROKER_URI}", "flower"]
    ports:
      - ${FLOWER_PORT:-5555}:5555
    restart: unless-stopped
    networks:
      - app
    depends_on:
      - rabbitmq

volumes:
  database:
  pgadmin:
  rabbitmq:

networks:
  app:
    driver: bridge