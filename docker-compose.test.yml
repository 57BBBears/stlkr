services:
  app:
    container_name: app
    build:
      context: .
      target: production
      args:
        POETRY_VERSION: ${POETRY_VERSION-}
    entrypoint: [ "./docker-entrypoint.sh" ]
    environment:
      SECRET_KEY: ${SECRET_KEY}
      RECAPTCHA_PUBLIC_KEY: ${RECAPTCHA_PUBLIC_KEY}
      RECAPTCHA_PRIVATE_KEY: ${RECAPTCHA_PRIVATE_KEY}
      DATABASE_DB: ${DATABASE_DB}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
      TEST_DATABASE_URI: ${TEST_DATABASE_URI}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USE_TLS: ${MAIL_USE_TLS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      URLS_PER_PAGE: ${URLS_PER_PAGE}
      ITEMS_PER_PAGE: ${ITEMS_PER_PAGE}
      LOG_CONFIG: ${LOG_CONFIG}
      TASK_BROKER_URI: ${TASK_BROKER_URI}
      TASK_CONCURRENCY: ${TASK_CONCURRENCY}
      TASK_LOG_FILE: ${TASK_LOG_FILE}
      WORKERS: ${WORKERS}
      CORE_DOMAIN: ${CORE_DOMAIN}
    ports:
      - 5000:5000
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - app
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test: curl --fail http://localhost:5000 || exit 1
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_DB}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - database:/var/lib/postgresql/data/pgdata
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:7.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT:-5050}:80
    networks:
      - app
    restart: unless-stopped
    depends_on:
      - postgres

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.0.5-management
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit ${RABBITMQ_DISK_FREE_LIMIT:-524288000}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - ${RABBITMQ_PORT:-15672}:15672
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s

  worker-default:
    container_name: worker-default
    build:
      context: .
      target: production
    command: [ "celery", "-A", "src.services.task.worker", "worker", "-c", "${TASK_CONCURRENCY}", "-n", "worker-default@%h", "-Q", "default", "-l", "${TASK_LOG_LEVEL:-info}", "-f", "${TASK_LOG_FILE}", "-E" ]
    environment:
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
      TASK_BROKER_URI: ${TASK_BROKER_URI}
    restart: unless-stopped
    networks:
      - app
    depends_on:
      - postgres
      - rabbitmq
    healthcheck:
      test: [ "CMD", "celery", "-A", "src.services.task.worker", "inspect", "ping" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s

  flower:
    container_name: flower
    image: mher/flower:2.0
    command: ["celery", "--broker=${TASK_BROKER_URI}", "flower"]
    ports:
      - ${FLOWER_PORT:-5555}:5555
    restart: unless-stopped
    networks:
      - app
    depends_on:
      - rabbitmq

volumes:
  database:
  pgadmin:
  rabbitmq:

networks:
  app:
    driver: bridge